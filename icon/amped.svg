<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.12" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3e72"/>
      <stop offset="0.5" stop-color="#16203c"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fa0"/>
      <stop offset="1" stop-color="#f43d5c"/>
    </linearGradient>
    <linearGradient id="capB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe999"/>
      <stop offset="1" stop-color="#ffc01c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <clipPath id="capsuleClip">
      <rect x="246" y="388" width="532" height="248" rx="124" ry="124"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="512" y="388" width="266" height="248"/>
    </clipPath>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="softSheen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#tile)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#vignette)"/>
  <rect x="96" y="98" width="832" height="828" rx="196" ry="196" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Warm aura -->
  <circle cx="512" cy="470" r="300" fill="url(#aura)"/>

  <!-- Two-tone capsule, tilted -->
  <g transform="rotate(-32 512 512)">
    <!-- Drop shadow -->
    <ellipse cx="512" cy="548" rx="278" ry="116" fill="#000000" fill-opacity="0.30" filter="url(#blur)"/>

    <!-- Body -->
    <rect x="246" y="388" width="532" height="248" rx="124" ry="124" fill="url(#capA)"/>
    <g clip-path="url(#rightHalf)">
      <rect x="246" y="388" width="532" height="248" rx="124" ry="124" fill="url(#capB)"/>
    </g>

    <!-- Seam between the two halves -->
    <line x1="512" y1="396" x2="512" y2="628" stroke="#7a1f2b" stroke-opacity="0.20" stroke-width="6"/>

    <!-- Even sheen (top light + bottom shade) and a soft hotspot, both halves -->
    <g clip-path="url(#capsuleClip)">
      <rect x="246" y="388" width="532" height="248" fill="url(#sheen)"/>
      <ellipse cx="512" cy="450" rx="214" ry="30" fill="#ffffff" fill-opacity="0.30" filter="url(#softSheen)"/>
    </g>

    <!-- Crisp edge -->
    <rect x="246" y="388" width="532" height="248" rx="124" ry="124" fill="none"
          stroke="#5a1320" stroke-opacity="0.15" stroke-width="5"/>
  </g>
</svg>
