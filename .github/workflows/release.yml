name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@main
    secrets: inherit
    with:
      name: Amped
      app: dist/Amped.app
      cask: amped
      runner: macos-15
      signed_by_build: true
      build: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
        brew install xcodegen librsvg
        CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=82K3YC8HVF \
          MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" ./build.sh
